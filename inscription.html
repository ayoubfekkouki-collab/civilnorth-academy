<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription - CivilNorth Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,Arial,sans-serif;background:#02040a;color:#f8fafc}
.bg-hero{background-image:linear-gradient(to right,#02040a 0%,rgba(2,4,10,.95) 50%,rgba(2,4,10,.72) 100%),url('assets/arriere%20plan.png');background-size:cover;background-position:center}
.glass{background:rgba(6,10,19,.82);border:1px solid rgba(51,65,85,.75);backdrop-filter:blur(12px)}
</style></head><body class="min-h-screen bg-hero">
<header class="border-b border-slate-900/70 bg-[#02040a]/85 backdrop-blur-xl sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <img src="assets/civilnorth-logo.png" class="h-16 w-16 object-contain" alt="CivilNorth Academy">
      <div class="flex flex-col items-center">
        <div class="text-2xl font-extrabold"><span class="text-white">Civil</span><span class="text-blue-500">North</span></div>
        <div class="flex items-center justify-center gap-2">
          <span class="h-0.5 w-3 bg-blue-500/50"></span>
          <span class="text-[9px] tracking-[0.35em] text-gray-300 font-bold">ACADEMY</span>
          <span class="h-0.5 w-3 bg-blue-500/50"></span>
        </div>
      </div>
    </a>
    <nav class="hidden md:flex items-center gap-7 text-sm text-gray-300">
      <a href="index.html" class="inline-flex h-8 items-center hover:text-white">Accueil</a>
      <a href="formations.html" class="inline-flex h-8 items-center hover:text-white">Formations</a>
      <a href="index.html#logiciels" class="inline-flex h-8 items-center hover:text-white">Logiciels</a>
      <a href="apropos.html" class="inline-flex h-8 items-center hover:text-white">À propos</a>
      <a href="contact.html" class="inline-flex h-8 items-center hover:text-white">Contact</a>
    </nav>
    <a href="https://wa.me/212661046073" class="glass px-4 py-2 rounded-lg text-sm font-semibold hover:text-white"><i class="fa-brands fa-whatsapp text-emerald-500"></i> WhatsApp</a>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
  <section class="text-center">
    <p class="text-blue-500 text-xs font-bold tracking-[0.2em] uppercase">Inscription</p>
    <h1 class="text-4xl lg:text-5xl font-black mt-4">Choisissez votre formation</h1>
    <p class="text-gray-400 mt-4 max-w-2xl mx-auto">Remplissez vos informations et sélectionnez la formation souhaitée. Notre équipe vous contactera pour confirmer votre inscription.</p>
  </section>

  <form class="glass rounded-2xl p-6 lg:p-8 mt-10 space-y-7">
    <div class="grid sm:grid-cols-2 gap-5">
      <label class="block">
        <span class="text-sm font-bold text-gray-300">Nom</span>
        <input type="text" name="nom" required class="mt-2 w-full rounded-xl border border-slate-700 bg-[#02040a]/80 px-4 py-3 text-white outline-none focus:border-blue-500" placeholder="Votre nom">
      </label>
      <label class="block">
        <span class="text-sm font-bold text-gray-300">Prénom</span>
        <input type="text" name="prenom" required class="mt-2 w-full rounded-xl border border-slate-700 bg-[#02040a]/80 px-4 py-3 text-white outline-none focus:border-blue-500" placeholder="Votre prénom">
      </label>
    </div>

    <label class="block">
      <span class="text-sm font-bold text-gray-300">Ville</span>
      <input type="text" name="ville" required class="mt-2 w-full rounded-xl border border-slate-700 bg-[#02040a]/80 px-4 py-3 text-white outline-none focus:border-blue-500" placeholder="Votre ville">
    </label>

    <div>
      <p id="formation-title" class="text-sm font-bold text-gray-300">Formation souhaitée</p>
      <div class="grid sm:grid-cols-2 gap-3 mt-3">
        <label class="glass rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:border-blue-500/60">
          <input type="checkbox" name="formation" value="AutoCAD" data-slug="autocad" class="h-4 w-4 accent-blue-600">
          <span class="font-bold">Formation AutoCAD</span>
        </label>
        <label class="glass rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:border-blue-500/60">
          <input type="checkbox" name="formation" value="Revit" data-slug="revit" class="h-4 w-4 accent-blue-600">
          <span class="font-bold">Formation Revit</span>
        </label>
        <label class="glass rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:border-blue-500/60">
          <input type="checkbox" name="formation" value="Robot Structural Analysis" data-slug="robot" class="h-4 w-4 accent-blue-600">
          <span class="font-bold">Formation Robot Structural Analysis</span>
        </label>
        <label class="glass rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:border-blue-500/60">
          <input type="checkbox" name="formation" value="Primavera P6" data-slug="primavera" class="h-4 w-4 accent-blue-600">
          <span class="font-bold">Formation Primavera P6</span>
        </label>
        <label class="glass rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:border-blue-500/60 sm:col-span-2">
          <input type="checkbox" name="formation" value="MS Project" data-slug="ms-project" class="h-4 w-4 accent-blue-600">
          <span class="font-bold">Formation MS Project</span>
        </label>
      </div>
    </div>

    <div class="flex flex-wrap gap-3 pt-2">
      <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-7 py-3 rounded-xl font-bold">Envoyer la demande</button>
      <a href="https://wa.me/212661046073" class="glass px-7 py-3 rounded-xl font-bold hover:text-white"><i class="fa-brands fa-whatsapp text-emerald-500"></i> Nous contacter sur WhatsApp</a>
    </div>
  </form>
</main><script>
const selectedFormation = new URLSearchParams(window.location.search).get('formation');
if (selectedFormation) {
  const title = document.getElementById('formation-title');
  const selectedInput = document.querySelector(`[data-slug="${selectedFormation}"]`);
  if (title) title.textContent = 'Souhaitez autres formation';
  if (selectedInput) selectedInput.checked = true;
}
</script></body></html>
